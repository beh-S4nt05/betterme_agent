name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PLUTO_MOCK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar (pacote + ruff)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      # Tag só vira release se passar os MESMOS portões do CI —
      # nada de liberar zip sem ruff + suíte + varredura.
      - name: "Portão 1/3 — ruff (lint)"
        run: ruff check --select E9,F,B,PLE .

      - name: "Portão 2/3 — suíte (tests/run_all.py)"
        run: python tests/run_all.py
        timeout-minutes: 20

      - name: "Portão 3/3 — varredura (segredos/dados pessoais)"
        run: pluto varredura --tudo

      # Zip idêntico ao processo local: só arquivos rastreados
      # (git ls-files) — dados pessoais nunca entram.
      - name: Zip (git archive)
        run: git archive --format=zip -o "pluto-agente-${{ github.ref_name }}.zip" HEAD

      - name: GitHub Release com o zip anexado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "pluto-agente-${{ github.ref_name }}.zip" \
            --title "Pluto Agente ${{ github.ref_name }}" \
            --generate-notes
